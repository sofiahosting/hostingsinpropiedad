<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .card {
    width:1200px; height:630px; position:relative; overflow:hidden;
    background:linear-gradient(150deg,#27567C 0%,#33648C 48%,#4E7C9C 100%);
    font-family:'DM Sans',sans-serif; display:flex;
  }
  .c1 { position:absolute; top:-180px; right:240px; width:520px; height:520px; border-radius:50%; background:rgba(255,255,255,0.06); }
  .c2 { position:absolute; bottom:-220px; left:-140px; width:520px; height:520px; border-radius:50%; background:rgba(200,169,110,0.12); }
  .left {
    width:64%; padding:64px 24px 56px 76px; position:relative; z-index:2;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .eyebrow {
    display:inline-block; align-self:flex-start; background:rgba(255,255,255,0.15); color:#fff;
    font-size:17px; font-weight:500; letter-spacing:3px; text-transform:uppercase;
    padding:8px 20px; border-radius:99px; border:1px solid rgba(255,255,255,0.35);
  }
  h1 {
    font-family:'Playfair Display',serif; font-weight:700; font-size:62px; line-height:1.12;
    color:#fff; margin-top:26px; text-shadow:0 2px 24px rgba(20,40,60,0.25);
  }
  h1 em { font-style:italic; color:#E6C57C; }
  .sub { margin-top:22px; font-size:23px; font-weight:300; color:rgba(255,255,255,0.92); line-height:1.5; max-width:560px; }
  .who { display:flex; align-items:center; gap:14px; margin-top:30px; }
  .who .name { font-family:'Playfair Display',serif; font-size:26px; font-weight:600; color:#fff; }
  .who .sep { color:rgba(255,255,255,0.5); }
  .who .url { font-size:19px; color:rgba(255,255,255,0.82); }
  .right { width:36%; position:relative; display:flex; align-items:center; justify-content:center; }
  .ring {
    width:392px; height:392px; border-radius:50%;
    background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 24px 70px rgba(20,40,60,0.4);
  }
  .portrait {
    width:360px; height:360px; border-radius:50%; object-fit:cover; object-position:center top;
    border:6px solid rgba(255,255,255,0.9);
  }
  .badge {
    position:absolute; bottom:96px; right:14px; z-index:3;
    background:#fff; color:#2F6188; border-radius:14px; padding:12px 18px; text-align:center;
    box-shadow:0 12px 30px rgba(20,40,60,0.3);
  }
  .badge .n { font-family:'Playfair Display',serif; font-weight:700; font-size:26px; line-height:1; }
  .badge .l { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#6B6355; margin-top:3px; }
</style>
</head>
